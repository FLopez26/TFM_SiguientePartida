[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siguiente-partida"
version = "0.1.0"
description = "Utilidades genéricas del recomendador de juegos de mesa Siguiente Partida"
license = "MIT"
license-files = ["src/siguiente_partida/LICENSE"]
authors = [{ name = "FLopez26" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["recomendador", "sistemas de recomendación", "item-knn", "métricas", "juegos de mesa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/FLopez26/TFM_SiguientePartida"

[tool.setuptools.packages.find]
where = ["src"]
include = ["siguiente_partida*"]